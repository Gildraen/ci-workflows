name: reusable-validate

on:
  workflow_call:
    inputs:
      task-name:
        description: Task to run for the "validate" contract.
        type: string
        default: validate

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Task directories
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/task
            ~/.task
          key: ${{ runner.os }}-task-${{ hashFiles('Taskfile.yml') }}
          restore-keys: |
            ${{ runner.os }}-task-

      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run consumer validate contract
        env:
          TASK_REMOTE_TRUSTED_HOSTS: github.com
        run: task ${{ inputs.task-name }}
