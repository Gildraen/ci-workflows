name: reusable-devcontainer-test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run task test in the dx devcontainer
        uses: devcontainers/ci@v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: task test
