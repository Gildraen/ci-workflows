name: reusable-maintenance

on:
  workflow_call:
    inputs:
      link-check-paths:
        description: Glob patterns (space-separated) of files to check for broken links.
        type: string
        default: "docs/**/*.md README.md AGENTS.md"
      link-check-excludes:
        description: Extra lychee --exclude patterns (space-separated).
        type: string
        default: ""

jobs:
  check-links:
    name: Check docs links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >
            --no-progress
            --exclude-loopback
            ${{ inputs.link-check-excludes }}
            ${{ inputs.link-check-paths }}
          fail: true
