name: reusable-release-please

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the Release Please configuration file.
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path to the Release Please manifest file.
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: Branch that receives the release pull request.
        type: string
        default: main
      expected-sha:
        description: Commit SHA whose successful validation triggered this call.
        type: string
        required: true
      app-client-id:
        description: Client ID of the GitHub App installed on the caller repository.
        type: string
        required: true
    secrets:
      app-private-key:
        description: Private key for the GitHub App used to create the release pull request.
        required: true

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check validated commit is still the target branch tip
        id: validated-sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          current_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq .object.sha)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TARGET_BRANCH} advanced after validation; skipping this release run."
          else
            echo "matches=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create repository-scoped GitHub App token
        id: app-token
        if: steps.validated-sha.outputs.matches == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.validated-sha.outputs.matches == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ inputs.target-branch }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}