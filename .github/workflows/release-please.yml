name: release-please

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Open or update release PR
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/reusable-release-please.yml
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      target-branch: main
      expected-sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      release-please-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}