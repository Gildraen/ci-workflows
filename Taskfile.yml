version: '3'

tasks:
  default:
    cmds:
      - task --list
  validate:
    desc: Parse workflows and Taskfiles; run actionlint when available.
    cmds:
      - node --test tests/syntax.test.cjs
      - task --list >/dev/null
      - task --dir fixtures/pilot --list >/dev/null
      - |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint .github/workflows/*.yml fixtures/pilot/.github/workflows/*.yml
        else
          printf 'actionlint unavailable; YAML syntax checked only.\n'
        fi
  test:
    desc: Check reusable contracts and local pilot Task behavior.
    cmds:
      - node --test tests/contracts.test.cjs
